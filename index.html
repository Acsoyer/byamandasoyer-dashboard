<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#69162D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>by Amanda Soyer — Orders</title>
<link rel="icon" type="image/x-icon" href="https://ivnybivjjydihltknlmo.supabase.co/storage/v1/object/public/references/icons-dashboard/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="https://ivnybivjjydihltknlmo.supabase.co/storage/v1/object/public/references/icons-dashboard/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://ivnybivjjydihltknlmo.supabase.co/storage/v1/object/public/references/icons-dashboard/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="https://ivnybivjjydihltknlmo.supabase.co/storage/v1/object/public/references/icons-dashboard/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://ivnybivjjydihltknlmo.supabase.co/storage/v1/object/public/references/icons-dashboard/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1EA; --card:#FFFFFF; --ink:#43212E; --ink-soft:#8A6B76; --ink-faint:#B39CA5;
    --line:#ECE0D7; --accent:#8C1D3A; --accent2:#D14D72; --accent-soft:#FBE7EC;
    --new:#D14D72; --quoted:#C98A2E; --confirmed:#6E9B5B; --delivered:#46765F; --done:#9A8C93; --cancel:#B26B6B;
    --paid:#6E9B5B; --deposit:#C98A2E; --unpaid:#B39CA5;
    --shadow:0 2px 12px rgba(67,33,46,.08); --shadow-lg:0 12px 40px rgba(67,33,46,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink)}

  /* Login */
  #login{position:fixed;inset:0;background:linear-gradient(160deg,#F7F1EA,#F1E2D8);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;z-index:100}
  #login img{width:290px;max-width:80%;margin-bottom:26px}
  #login .box{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;width:100%;max-width:340px}
  #login h2{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:600;font-size:18px;margin:0 0 14px;text-align:center}
  #login input{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;font-size:16px;font-family:inherit;outline:none;margin-bottom:12px}
  #login input:focus{border-color:var(--accent)}
  #login button{width:100%;border:none;border-radius:13px;background:var(--accent);color:#fff;font-family:inherit;font-weight:600;font-size:15px;padding:13px;cursor:pointer}
  #login .err{color:var(--cancel);font-size:13px;margin:2px 0 12px;display:none}
  #login .hint{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:14px}

  #app{display:none;max-width:860px;margin:0 auto;padding:0 16px 90px}
  header{position:sticky;top:0;background:rgba(247,241,234,.92);backdrop-filter:blur(10px);z-index:20;padding:14px 0 0;border-bottom:1px solid var(--line)}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{height:34px}
  .brand-restart{display:flex;align-items:center;margin:0;padding:0;border:0;background:transparent;cursor:pointer}
  .brand .dt{color:var(--ink-soft);font-size:13px}
  .logout{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer}

  /* view tabs */
  .tabs{display:flex;gap:4px;background:#EFE3DA;border-radius:12px;padding:4px}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

  .ordersUI{padding-bottom:10px}
  .search{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:11px 14px;font-size:15px;font-family:inherit;outline:none;margin-top:12px}
  .search:focus{border-color:var(--accent)}
  .buckets{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .buckets::-webkit-scrollbar{display:none}
  .bpill{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:all .15s}
  .bpill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .bpill .n{font-variant-numeric:tabular-nums;opacity:.65}
  .bpill .badge{background:var(--accent2);color:#fff;border-radius:99px;min-width:16px;height:16px;padding:0 4px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .statusrow{display:flex;gap:6px;overflow-x:auto;padding:9px 0 4px;scrollbar-width:none}
  .statusrow::-webkit-scrollbar{display:none}
  .schip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer}
  .schip.active{background:var(--accent-soft);border-color:var(--accent2);color:var(--accent)}

  #main{padding-top:14px}
  .ghead{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:600;font-size:15px;color:var(--ink-soft);margin:20px 2px 10px;display:flex;align-items:center;gap:9px}
  .ghead .ln{flex:1;height:1px;background:var(--line)}

  .ocard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 15px 14px 17px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
  .ocard:active{transform:scale(.995)}
  .ocard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st)}
  .oc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .oc-name{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
  .oc-name .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);flex:0 0 auto}
  .ocard:not(.unread) .oc-name{font-weight:500}
  .ocard:not(.unread) .oc-name .dot{display:none}
  .oc-price{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:600;font-size:15px;white-space:nowrap}
  .oc-meta{color:var(--ink-soft);font-size:13px;margin-top:3px}
  .oc-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .oc-date{font-size:13px;font-weight:600}
  .oc-date.over{color:var(--cancel)}
  .oc-date .rel{color:var(--ink-faint);font-weight:500;margin-left:5px}
  .chips{display:flex;gap:6px;align-items:center}
  .chip{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:99px;color:#fff}
  .paychip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;border:1.5px solid}
  .fbchip{font-size:13px;line-height:1;padding:2px 1px}
  .empty{text-align:center;color:var(--ink-faint);padding:50px 20px;font-size:14px}
  .blchip{font-size:10.5px;font-weight:700;color:#fff;background:var(--cancel);padding:2px 7px;border-radius:99px;margin-left:2px}
  .blbtn{width:100%;margin-top:10px;border-radius:12px;padding:11px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;border:1.5px solid var(--cancel);background:none;color:var(--cancel)}
  .delbtn{width:100%;margin-top:10px;border-radius:12px;padding:11px;font-family:inherit;font-weight:600;font-size:14px;
    cursor:pointer;border:1.5px solid transparent;background:#F4E7E7;color:#A32020}
  .delbtn.confirm{background:#A32020;color:#fff;border-color:#A32020}
  .fbbox{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .fbbox .fbem{font-size:24px;line-height:1}
  .fbbox b{font-size:15px;font-weight:700;display:block;color:var(--ink)}
  .fbbox .fbcap{font-size:11.5px;color:var(--ink-faint)}
  .fbbox.excellent,.fbbox.good{border-color:var(--paid)}
  .fbbox.poor{border-color:var(--cancel)}
  .blbtn.on{background:var(--cancel);color:#fff;border-color:transparent}

  /* stats */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:6px}
  .statcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
  .statcard .num{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:600;font-size:28px;line-height:1}
  .statcard .cap{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
  .statcard.wide{grid-column:1/-1}
  .barrow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .barrow .bname{flex:0 0 128px;font-weight:600}
  .barrow .btrack{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
  .barrow .bfill{height:100%;background:linear-gradient(90deg,#E28AA3,var(--accent2));border-radius:99px}
  .barrow .bval{flex:0 0 auto;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  /* calendar */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
  .calhead .mo{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:600;font-size:18px}
  .calnav{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;cursor:pointer;color:var(--ink)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .caldow{text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;padding:4px 0}
  .calcell{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:5px;cursor:pointer;position:relative;display:flex;flex-direction:column}
  .calcell.empty{background:transparent;border:none;cursor:default}
  .calcell.today{border-color:var(--line);box-shadow:none}
  .calcell.sel{border:2px solid var(--accent);background:var(--card);color:var(--ink);padding:4px}
  .calcell .d{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;font-size:12px;font-weight:600}
  .calcell.today .d{background:var(--accent);color:#fff}
  .calcell.past .d{color:#A9AEAB}
  .calcell.past.today .d{color:#fff}
  .calcell .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
  .calcell .cdot{width:7px;height:7px;border-radius:50%}
  .calcell .more{font-size:9px;color:var(--ink-faint)}
  .calsel{margin-top:16px}

  /* my info */
  .inforow{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
  .inforow .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
  .inforow .vwrap{display:flex;align-items:center;gap:10px}
  .inforow input,.inforow textarea{flex:1;border:none;background:none;font-family:inherit;font-size:15px;color:var(--ink);outline:none;padding:0;resize:none}
  .inforow textarea{min-height:44px;line-height:1.4}
  .cpbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 11px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
  .cpbtn.ok{background:var(--confirmed);color:#fff;border-color:transparent}
  .infonote{font-size:12.5px;color:var(--ink-faint);margin:6px 2px 16px}

  /* sheet */
  #overlay{position:fixed;inset:0;background:rgba(40,20,28,.4);backdrop-filter:blur(2px);z-index:50;display:none}
  #overlay.show{display:block}
  #sheet{position:fixed;z-index:60;background:var(--bg);box-shadow:var(--shadow-lg);display:none;flex-direction:column;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:92vh;border-radius:22px 22px 0 0}
  #sheet.show{display:flex;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translate(-50%,40px);opacity:.6}to{transform:translate(-50%,0);opacity:1}}
  .sh-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative}
  .sh-grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .sh-close{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:15px;color:var(--ink-soft);cursor:pointer}
  .sh-name{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:600;font-size:21px}
  .sh-sub{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
  .sh-ordered{color:var(--ink-faint);font-size:11.5px;margin-top:5px;display:flex;align-items:center;gap:5px}
  .sh-ordered b{font-weight:600;color:var(--ink-soft)}
  .sh-body{overflow-y:auto;padding:16px 18px 24px}
  .sh-body::-webkit-scrollbar{width:0}
  .statusbtns{display:flex;gap:7px;flex-wrap:wrap}
  .sbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer}
  .sbtn.on{color:#fff;border-color:transparent}
  .sec{margin-top:18px}
  .sec .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  .sec .lbl .cnt{font-weight:600;letter-spacing:0;text-transform:none;color:var(--brand);margin-left:4px}
  .pgal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  .pgal.one{grid-template-columns:1fr}
  .pgi{position:relative;display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
  .pgal.one .pgi{border-radius:14px}
  .pgi img{width:100%;height:100%;aspect-ratio:1;object-fit:cover;display:block}
  .pgal.one .pgi img{aspect-ratio:auto;height:auto}
  .pgn{position:absolute;top:5px;left:5px;background:rgba(20,20,20,.6);color:#fff;font-size:10px;font-weight:700;
    width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .kv{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .kv .r{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .kv .r:last-child{border-bottom:none}
  .kv .k{color:var(--ink-soft);flex:0 0 auto}
  .kv .v{text-align:right;font-weight:500}
  .cols{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .cols span{display:inline-flex;align-items:center;gap:5px;font-size:13px}
  .cols i{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.12)}
  .photo{background:var(--card);border:1px dashed var(--line);border-radius:14px;height:110px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12px;flex-direction:column;gap:6px}
  .photo .big{font-size:26px}
  .notebox{background:var(--accent-soft);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.5;color:var(--ink)}
  .warnbox{background:#F7E4E0;border:1px solid #ECC9C2;border-radius:12px;padding:11px 13px;font-size:13px;color:#7A2233;line-height:1.5}

  /* payment block */
  .paywrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .paytop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .paytop .big{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:600;font-size:20px}
  .paytop .left{font-size:13px;font-weight:600;color:var(--deposit)}
  .paytop .left.done{color:var(--paid)}
  .paytrack{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
  .payfill{height:100%;background:var(--paid);border-radius:99px;transition:width .3s}
  .payinput{display:flex;gap:8px;align-items:center}
  .payinput input{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:15px;font-family:inherit;outline:none}
  .payinput input:focus{border-color:var(--accent2)}
  .payquick{display:flex;gap:7px;margin-top:9px}
  .pqbtn{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}

  .actionbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;border:none;margin-top:10px}
  .copybtn{background:var(--ink);color:#fff}
  .copybtn.ok{background:var(--confirmed)}
  .wa{background:#25D366;color:#fff;text-decoration:none}
  .readtoggle{width:100%;margin-top:10px;background:none;border:1px solid var(--line);border-radius:12px;padding:11px;font-family:inherit;font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer}

  @media(min-width:560px){
    #sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:22px;max-height:88vh}
    #sheet.show{animation:pop .24s ease}
    @keyframes pop{from{transform:translate(-50%,-46%);opacity:.6}to{transform:translate(-50%,-50%);opacity:1}}
    .sh-grab{display:none}
  }

  /* 2026 operations redesign */
  :root{
    --bg:#F3F4F2;--card:#FFFFFF;--ink:#1E2523;--ink-soft:#65706C;--ink-faint:#98A09D;
    --line:#DDE2DF;--accent:#6D2435;--accent2:#8B3348;--accent-soft:#F4E8EB;
    --new:#B4233A;--quoted:#A46B16;--awaiting:#315E74;--confirmed:#34745A;--done:#64706C;
    --cancel:#A74646;--deleted:#7C8380;--paid:#34745A;--deposit:#A46B16;--unpaid:#7C8380;
    --shadow:0 1px 3px rgba(25,35,31,.06),0 8px 24px rgba(25,35,31,.04);
    --shadow-lg:0 24px 60px rgba(25,35,31,.22)
  }
  body{background:var(--bg)}
  #login{background:linear-gradient(160deg,#F4F5F3,#E7EAE7)}
  header{background:rgba(243,244,242,.94)}
  .tabs{background:#E6E9E6;border:1px solid var(--line)}
  .ordersUI{padding-bottom:7px}
  .buckets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:11px 0 0;overflow:visible;border-bottom:1px solid var(--line)}
  .bpill{min-width:0;justify-content:center;border:0;border-radius:0;background:transparent;padding:9px 4px 10px;position:relative;color:var(--ink-soft);gap:5px;white-space:nowrap}
  .bpill.active{background:transparent;color:var(--ink);box-shadow:none}
  .bpill.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
  .bpill .n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#E2E6E3;color:var(--ink);font-size:10px;opacity:1}
  .bpill .badge{position:absolute;top:2px;right:3px;box-shadow:0 0 0 2px var(--bg)}
  .statusrow{display:none}
  .ocard{border-radius:14px;padding:15px 16px;margin-bottom:9px;overflow:visible}
  .ocard::before{display:none}
  .ocard.unread{background:#FFF9FA;border-color:#D9A7B3;box-shadow:0 0 0 1px rgba(180,35,58,.06),var(--shadow)}
  .ocard.unread::after{content:"NEW";position:absolute;right:14px;top:-7px;background:var(--new);color:#fff;border-radius:99px;padding:3px 7px;font-size:9px;font-weight:800;letter-spacing:.08em}
  .oc-name{font-size:16px}.oc-name .dot{display:none!important}
  .oc-price{font-family:'Instrument Sans',system-ui,sans-serif;font-size:21px;font-weight:700;letter-spacing:-.02em}
  .oc-date{font-size:12.5px}.oc-timegrid{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;color:var(--ink-soft);font-size:12px}
  .oc-timegrid span{display:inline-flex;align-items:center;gap:5px}.oc-timegrid b{color:var(--ink);font-weight:600}
  .chip{display:none}.ghead{font-family:'Instrument Sans',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700}

  .topnav-ink{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--accent);border-radius:2px;transition:transform .26s cubic-bezier(.4,0,.2,1),width .26s cubic-bezier(.4,0,.2,1);pointer-events:none}

  /* orders flow-card (first four, a sequence) */
  #buckets{display:block;overflow:visible;padding:0}
  .flowcard{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px;margin-top:14px;box-shadow:0 1px 3px rgba(25,35,31,.05)}
  .ftab{position:relative;flex:1 1 0;min-width:0;background:none;border:0;font-family:inherit;cursor:pointer;text-align:center;padding:10px 3px 11px;border-radius:9px;transition:background .2s}
  .ftab .fnm{display:block;font-size:11.5px;font-weight:600;line-height:1.18;color:var(--ink-soft);transition:color .18s}
  .ftab .fct{position:absolute;top:5px;right:6px;font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;background:#EAEDEB;color:var(--ink-faint);border-radius:99px;min-width:16px;height:16px;line-height:16px;padding:0 4px;transition:all .2s}
  .ftab .fdot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--sc)}

  .ftab::after{content:"";position:absolute;left:22%;right:22%;bottom:4px;height:2.5px;border-radius:2px;background:var(--sc);opacity:.32;transition:opacity .2s}

  /* ============================================================
     UNIFIED CARD BADGES (v57) — one column, uniform width & size.

     the card's right column so they line up regardless of content.
     ============================================================ */
  .overview-badges{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:5px;min-width:0;margin:0;padding-left:9px;border-left:1px solid #F0E8E2}
  .overview-badges > *{
    width:100%;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;text-align:center;
    min-height:24px;padding:3px 6px;border-radius:7px;
    font-size:9px;font-weight:800;line-height:1.12;white-space:normal;
    margin:0;max-width:none;
  }
  .overview-badges .paychip{border-width:1.5px;border-style:solid}
  .overview-badges .order-progress-chip{border:1px solid #CCD9D1;background:#F0F5F2;color:#2F6F55}
  .overview-badges .order-progress-chip.accepted{border-color:#B9D2C3;background:#E8F3EC;color:#246344}
  .overview-badges .order-progress-chip.closed{border-color:#D5D9D7;background:#F0F2F1;color:#68716D}
  .overview-badges .order-progress-chip span{display:block}
  .overview-badges .customer-accepted-chip{border:1px solid #CCD9D1;background:#F0F5F2;color:#2F6F55}
  @media(max-width:560px){
    .overview-badges > *{font-size:8.5px;min-height:22px;padding:3px 5px}
  }
  /* ============================================================
     CARD REFINEMENTS (v58)
     ============================================================ */
  /* Keep the raised NEW badge visible outside the compact overview card. */
  .overview-card{overflow:visible!important}
  .overview-card::before{top:0!important;bottom:0!important;left:0!important;width:6px!important;border-radius:11px 0 0 11px!important;
    background:color-mix(in srgb,var(--bucket-color) 78%,#fff)!important}

  /* Overview hierarchy: pick-up first, action/payment next, price last. */
  .overview-card-top{display:block}
  .overview-card-name{font-size:13.5px;line-height:1.22}
  .overview-pickup{margin-top:8px}
  .overview-pickup-label{display:block;margin-bottom:2px;color:var(--ink-faint);font-size:7.5px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}
  .overview-pickup-line{display:flex;min-width:0;align-items:baseline;gap:4px;color:var(--ink);line-height:1.1}
  .overview-pickup-line strong{font:800 17px/1.1 'Instrument Sans',system-ui,sans-serif;letter-spacing:-.015em}
  .overview-pickup-line span{overflow:hidden;color:var(--ink-soft);font-size:11px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
  .overview-pickup.today .overview-pickup-line strong{color:#277051}
  .overview-pickup.tomorrow .overview-pickup-line strong{color:#A36D00}
  .overview-pickup.overdue .overview-pickup-line strong{color:#A43745}
  .overview-pickup-meta{display:block;margin-top:3px;color:var(--ink-faint);font-size:9px;font-weight:600}
  .overview-card-price{margin-top:7px;color:var(--ink-soft)!important;font:700 11.5px/1.1 'Instrument Sans',system-ui,sans-serif!important;letter-spacing:0!important;white-space:nowrap}
  .overview-card-price::before{content:"Total ";color:var(--ink-faint);font-size:8px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}

  /* faint dashed divider between information and status */
  .overview-badges{border-left:1px dashed #E0E4E1!important}

  /* narrower badges */
  .overview-card{grid-template-columns:minmax(0,1fr) 96px!important}
  .overview-badges > *{font-size:8.5px!important;min-height:22px!important;padding:2px 5px!important;border-radius:6px!important}
  @media(max-width:560px){
    .overview-card{grid-template-columns:minmax(0,1fr) 90px!important}
    .overview-pickup-line strong{font-size:16px}
    .overview-badges > *{font-size:8px!important;min-height:20px!important}
  }

  /* flow-tab underline stronger; card stripe softer — meet in the middle */
  .ftab::after{opacity:.6!important}
  .ftab.on::after{opacity:1!important}
  /* ============================================================
     BOTTOM ACTIONS — single column, refined (v58)
     ============================================================ */
  .order-action-grid{display:flex!important;flex-direction:column!important;gap:8px!important}
  .order-action{width:100%;min-height:46px!important;justify-content:flex-start!important;gap:11px!important;
    padding:12px 14px!important;border-radius:12px!important;font-size:12.5px!important;font-weight:700!important;
    border:1px solid #DDE2DF!important;box-shadow:none!important;transition:background .15s,border-color .15s,transform .1s}
  .order-action:hover{transform:translateY(-1px)}
  .order-action:active{transform:translateY(0)}
  .order-action svg{width:18px!important;height:18px!important}
  .order-action.bad{color:var(--accent)!important;background:#FCF6F7!important;border-color:#E7D2D8!important}
  .order-action.archive{color:#4C5A54!important;background:#F5F7F5!important;border-color:#DCE2DE!important}
  .order-action.delete{color:#98A0A0!important;background:#FAFAF9!important;border-color:#E4E6E4!important}
  .order-action.delete.armed,.order-action.armed{background:#A62D3E!important;border-color:#A62D3E!important;color:#fff!important}

  /* the two-button danger row (renderOrderDetail) -> single column too */
  .danger-actions{display:flex!important;flex-direction:column!important;gap:8px!important}
  .danger-actions .blbtn,.danger-actions .delbtn{width:100%;min-height:46px;border-radius:12px;font-size:12.5px;font-weight:700;padding:12px 14px}

  /* ============================================================
     FINAL QUOTE — unified edit / saved design (v58)
     ============================================================ */
  #finalQuoteSection .lbl,.final-quote-line>.lbl{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px}
  .final-quote-line{display:block!important;grid-template-columns:none!important}
  .final-quote-controls{display:flex!important;grid-template-columns:none!important;align-items:stretch;gap:9px;min-width:0}
  .final-quote-separator,.final-quote-currency{display:none!important}

  /* the euro-prefixed input */
  .quote-input-wrap{position:relative;flex:1 1 auto;min-width:0;display:flex;align-items:stretch}
  .quote-input-euro{position:absolute;left:0;top:0;bottom:0;width:38px;display:flex;align-items:center;justify-content:center;
    font:700 17px/1 'Instrument Sans',sans-serif;color:var(--ink-soft);background:#F1F3F1;border:1.5px solid var(--line);
    border-right:0;border-radius:11px 0 0 11px;pointer-events:none}
  .quote-input-wrap #quotePrice{width:100%;height:44px;padding:0 12px 0 48px;border:1.5px solid var(--line);border-radius:11px;
    font:700 18px/1 'Instrument Sans',sans-serif;color:var(--ink);background:#fff;outline:none;letter-spacing:-.01em;transition:border-color .15s}
  .quote-input-wrap #quotePrice:focus{border-color:var(--accent)}
  .quote-input-wrap #quotePrice:focus + .quote-input-euro,.quote-input-wrap:focus-within .quote-input-euro{border-color:var(--accent);color:var(--accent)}

  .final-price-btn{flex:0 0 auto!important;height:44px!important;min-width:120px!important;padding:0 18px!important;
    border:0;border-radius:11px;background:var(--accent);color:#fff;font:700 13px/1 'Instrument Sans',sans-serif;
    cursor:pointer;white-space:nowrap;transition:filter .15s}
  .final-price-btn:hover{filter:brightness(1.06)}

  /* saved (locked) state — same footprint as edit */
  .final-quote-saved{display:flex!important;align-items:center;justify-content:space-between;gap:11px;
    height:44px;padding:0 6px 0 16px;border:1.5px solid var(--line);border-radius:11px;background:#FAFBFA}
  .final-quote-amount{color:var(--ink)!important;font:800 20px/1 'Instrument Sans',sans-serif!important;letter-spacing:-.02em}
  .final-quote-edit-btn{flex:0 0 auto;width:34px!important;height:34px!important;min-width:34px!important;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--ink-soft);font-size:14px;cursor:pointer;transition:background .15s,color .15s}
  .final-quote-edit-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* description box */
  .quoted-description{margin-top:11px}
  .quoted-description label{display:block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  .quoted-description textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
    font:400 13px/1.5 'Instrument Sans',sans-serif;color:var(--ink);background:#fff;outline:none;resize:vertical;transition:border-color .15s}
  .quoted-description textarea:focus{border-color:var(--accent)}

  @media(max-width:560px){
    .final-price-btn{min-width:96px!important;padding:0 12px!important;font-size:12px!important}
  }
  /* progress stepper — stop the last chevron's right edge being clipped (v59) */
  .progress-wrap{overflow:visible!important;padding-right:3px!important}
  .progress{overflow:visible!important}
  .progress-step:last-child{clip-path:none!important;border-radius:0 8px 8px 0!important}
  /* bottom actions — solid fill, centered, larger (v59) */
  .order-action{justify-content:center!important;gap:9px!important;min-height:50px!important;
    font-size:13.5px!important;font-weight:700!important;border:0!important;color:#fff!important}
  .order-action svg{width:20px!important;height:20px!important;stroke-width:2!important}
  .order-action.bad{background:var(--accent)!important;color:#fff!important}
  .order-action.archive{background:#5B6862!important;color:#fff!important}
  .order-action.delete{background:#7A8080!important;color:#fff!important}
  .order-action.cancel{background:#A62D3E!important;color:#fff!important}
  .order-action.customer-cancel{background:#8A6D74!important;color:#fff!important}
  .order-action.reset-progress{background:#4E7186!important;color:#fff!important}
  .order-action.whatsapp{background:#1E9E52!important;color:#fff!important}
  .order-action.bad.on{background:#7E1526!important}
  .order-action.delete.armed,.order-action.armed{background:#A62D3E!important;color:#fff!important}
  .danger-actions .blbtn,.danger-actions .delbtn{border:0!important;color:#fff!important;
    justify-content:center;text-align:center;font-size:13.5px!important;font-weight:700!important;min-height:50px!important}
  .danger-actions .blbtn{background:var(--accent)!important}
  .danger-actions .blbtn.on{background:#7E1526!important}
  .danger-actions .delbtn{background:#5B6862!important}
  /* search toggle button + drawer (v59) */
  .topnav-search-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;align-self:center;
    margin-left:6px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink-soft);
    cursor:pointer;flex:0 0 auto;transition:background .15s,color .15s,border-color .15s}
  .topnav-search-btn svg{width:17px;height:17px}
  .topnav-search-btn:hover{color:var(--ink)}
  .topnav-search-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .search-drawer{max-height:0;overflow:hidden;transition:max-height .24s ease,margin .24s ease,opacity .2s ease;opacity:0}
  .search-drawer.open{max-height:70px;opacity:1;margin-top:10px}
  .search-drawer .search{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);
    padding:11px 14px;font-size:15px;font-family:inherit;outline:none}
  .search-drawer .search:focus{border-color:var(--accent)}
  /* ============================================================
     PROGRESS STEPPER — single authoritative definition (v60)
     Overrides every earlier conflicting generation.
     ============================================================ */
  .progress{--arrow:9px;--overlap:8px;display:flex!important;align-items:center!important;
    width:max-content!important;min-width:100%!important;gap:0!important;margin:7px auto 2px!important;
    padding:0!important;overflow:visible!important}
  .progress-step{position:relative!important;display:flex!important;flex-direction:column!important;
    align-items:center!important;justify-content:center!important;
    flex:1 0 auto!important;min-width:78px!important;height:40px!important;
    margin-left:calc(-1 * var(--overlap))!important;padding:0 10px 0 calc(10px + var(--arrow))!important;
    border:0!important;border-radius:0!important;background:#E3E7E4!important;color:#68716D!important;
    box-shadow:none!important;font:700 10.5px/1.12 'Instrument Sans',sans-serif!important;
    white-space:nowrap!important;text-align:center!important;-webkit-tap-highlight-color:transparent;
    clip-path:polygon(0 0,calc(100% - var(--arrow)) 0,100% 50%,calc(100% - var(--arrow)) 100%,0 100%,var(--arrow) 50%)!important}
  /* first: flat left edge, no notch, normal left padding */
  .progress-step:first-child{margin-left:0!important;padding-left:11px!important;
    clip-path:polygon(0 0,calc(100% - var(--arrow)) 0,100% 50%,calc(100% - var(--arrow)) 100%,0 100%)!important}
  /* last: keep its LEFT notch (so previous arrow shows) but flat right edge */
  .progress-step:last-child{padding-right:12px!important;
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%,var(--arrow) 50%)!important}
  /* z-order: earlier steps sit ABOVE later ones so arrowheads are never covered */
  .progress-step:nth-child(1){z-index:9!important}.progress-step:nth-child(2){z-index:8!important}
  .progress-step:nth-child(3){z-index:7!important}.progress-step:nth-child(4){z-index:6!important}
  .progress-step:nth-child(5){z-index:5!important}
  .progress-step .step-line{display:block!important}
  .progress-step.workflow-complete{background:#82A875!important;color:#fff!important}
  .progress-step.workflow-active{background:#2F6F55!important;color:#fff!important}
  .progress-step.customer-accepted{background:var(--card)!important;color:#2F6F55!important}
  @media(max-width:560px){
    .progress{--arrow:8px;--overlap:7px}
    .progress-step{min-width:70px!important;height:38px!important;padding:0 8px 0 15px!important;font-size:9.5px!important}
    .progress-step:first-child{padding-left:9px!important}
    .progress-step:last-child{padding-right:10px!important}
  }

  /* ============================================================
     NEW DASHBOARD UX — compact global header and contextual tools
     ============================================================ */

  .profile-menu button:hover,.profile-menu button.current{background:#F3EEEB;color:var(--accent)}
  .profile-menu button svg{flex:0 0 auto;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .order-sort-btn svg,.period-cycle-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .order-sort-btn .sort-caret,.period-cycle-btn .sort-caret{font-size:10px;color:var(--ink-faint)}
  .orders-heading-row .topnav-search-btn{align-self:auto;margin-left:0;width:33px;height:33px}

async function hydratePrivatePhotos(orders){
  const refs=[...new Set((orders||[]).flatMap(o=>o.photoRefs||[]).filter(privatePhotoPath))];
  const missing=refs.map(privatePhotoPath).filter(path=>{const cached=signedPhotoCache.get(path);return !cached||cached.expires<=Date.now();});
  for(let i=0;i<missing.length;i+=100){
    const paths=missing.slice(i,i+100);
    const {data,error}=await sb.storage.from(PRIVATE_PHOTO_BUCKET).createSignedUrls(paths,21600);
    if(error){console.error('Could not create private photo links',error);continue;}
    (data||[]).forEach((item,index)=>{if(item&&item.signedUrl)signedPhotoCache.set(item.path||paths[index],{url:item.signedUrl,expires:Date.now()+20700000});});
  }

/* ---------- helpers ---------- */
function workflowStage(o){
  if(o.status==='new')return 1;
  if(o.status==='quoted')return 2;
  if(o.status==='awaiting_payment')return 3;
  if(o.status==='confirmed')return o.confirmedSentAt?5:4;
  if(o.status==='delivered')return 6;
  return 0;
}
let autoDeliveryEnabled=true;
function pickupMoment(o){
  if(!o.pdate)return null;
  const match=String(o.ptime||'').match(/(\d{1,2}):(\d{2})/);
  if(!match)return null;
  const date=new Date(`${o.pdate}T${String(match[1]).padStart(2,'0')}:${match[2]}:00`);
  return Number.isNaN(date.getTime())?null:date;
}
function pickupDeltaMs(o){const moment=pickupMoment(o);return moment?moment.getTime()-Date.now():null;}
async function syncAutoDelivered(){
  /* Collection completion is confirmed manually with the picked-up button. */
  return;
}
function isReadyForCollection(o){
  if(!o||['done','cancelled','deleted'].includes(o.status))return false;
  if(o.status==='delivered')return true;
  if(o.status!=='confirmed')return false;
  const delta=pickupDeltaMs(o);
  return delta!==null&&delta<=3600000;
}
function isPickupConfirmationStep(o){
  if(!o||['done','cancelled','deleted'].includes(o.status))return false;
  return o.status==='delivered'||workflowStage(o)===5;
}
function bucketOf(o){
  if(o.status==='done'||o.status==='cancelled'||o.status==='deleted')return o.status;
  if(isReadyForCollection(o))return 'cake_delivered';
  const stage=workflowStage(o);
  if(stage===1||stage===2)return 'new_orders';
  if(stage===3)return 'waiting_customer';
  if(stage===4||stage===5)return 'deposit_paid';
  return 'new_orders';
}

/* ---------- calendar ---------- */
function renderCalendar(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1),startDow=first.getDay(),days=new Date(y,m+1,0).getDate();
  const byDate={};ORDERS.filter(o=>o.status!=='deleted').forEach(o=>{(byDate[o.pdate]=byDate[o.pdate]||[]).push(o);});
  let cells='';
  for(let i=0;i<startDow;i++)cells+=`<div class="calcell empty"></div>`;
  for(let d=1;d<=days;d++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const os=byDate[iso]||[];const isToday=iso===today.toISOString().split('T')[0];const isSel=iso===calSel;const isPast=new Date(iso+'T00:00:00')<today;
    let dots=os.slice(0,4).map(o=>`<span class="cdot" style="background:${stColor(o.status)}"></span>`).join('');
    if(os.length>4)dots+=`<span class="more">+${os.length-4}</span>`;
    cells+=`<div class="calcell ${isToday?'today':''} ${isSel?'sel':''} ${isPast?'past':''}" onclick="calPick('${iso}')">
      <span class="d">${d}</span><div class="dots">${dots}</div></div>`;
  }
  let sel='';
  if(calSel){const os=(byDate[calSel]||[]);
    sel=`<div class="calsel"><div class="ghead"><span>${fmtDate(calSel)}</span><span class="ln"></span></div>`+
      (os.length?os.map(o=>cardHTML(o)).join(''):`<div class="empty">No pick-ups this day.</div>`)+`</div>`;}
  document.getElementById('main').innerHTML=`
    <div class="calhead">
      <button class="calnav" onclick="calShift(-1)">‹</button>
      <div class="mo">${MO[m]} ${y}</div>
      <button class="calnav" onclick="calShift(1)">›</button>
    </div>
    <div class="calgrid">${WD.map(w=>`<div class="caldow">${w}</div>`).join('')}${cells}</div>
    ${sel}`;
}
function calShift(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);calSel=null;renderCalendar();}
function calPick(iso){calSel=(calSel===iso?null:iso);renderCalendar();}

function statsEntries(orders,getValue){
  const counts=new Map();
  orders.forEach(o=>{const value=String(getValue(o)||'Not specified').trim()||'Not specified';counts.set(value,(counts.get(value)||0)+1);});
  return [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}

function analyticsDateISO(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
function analyticsDuration(seconds){seconds=Math.max(0,Number(seconds)||0);if(seconds<60)return `${Math.round(seconds)}s`;const minutes=Math.round(seconds/60);if(minutes<60)return `${minutes}m`;return `${Math.floor(minutes/60)}h ${minutes%60}m`;}
function analyticsPercent(value,total){return total?Math.round(Number(value||0)/total*100):0;}
function analyticsSourceLabel(value){const label=String(value||'Direct').trim()||'Direct',known={instagram:'Instagram',facebook:'Facebook',tiktok:'TikTok',direct:'Direct'};return known[label.toLowerCase()]||label;}

function customerStoragePaths(group){
  const marker='/storage/v1/object/public/references/',references=[],privatePaths=[];
  group.orders.flatMap(o=>o.photoRefs||[]).forEach(ref=>{
    const privatePath=privatePhotoPath(ref);
    if(privatePath&&privatePath.startsWith('orders/')){privatePaths.push(privatePath);return;}
    const at=String(ref||'').indexOf(marker);
    if(at<0)return;
    try{const path=decodeURIComponent(String(ref).slice(at+marker.length).split('?')[0]);if(path.startsWith('orders/'))references.push(path);}catch(_){}

}

  if(sb)sb.from('orders').update({status:'deleted'}).eq('id',id).then(({error})=>{
    if(error){ if(backup)ORDERS.splice(i,0,backup); refreshView();

  });
}

/* ---------- copy summary ---------- */
function copySummary(id){
  const o=ORDERS.find(x=>x.id===id);const deposit=Math.round((o.price||0)*0.5);const remaining=Math.max(0,(o.price||0)-(o.paid||0));
  const decor=(o.decor||[]).filter(d=>d!=='No decoration');
  const L=[];
  L.push(`🎂 ${BIZ.name} — Order summary`);
  L.push(``);
  L.push(`Name: ${o.name}`);
  L.push(`Cake: ${o.type} · ${o.size} · ${o.shape}`);
  L.push(`Flavour: ${o.flavor}`);
  if(o.colors&&o.colors.length)L.push(`Colours: ${o.colors.map(c=>c[0]).join(', ')}`);
  if(o.writing)L.push(`Writing: "${o.writing}" (${o.writingColor})`);
  if(o.cupcakes&&o.cupcakes!=='No cupcakes')L.push(`Cupcakes: ${o.cupcakes}`);

  L.push(``);

  if(o.paid>0){L.push(`Already paid: €${o.paid}`);L.push(`Remaining: €${remaining}`);}
  else L.push(`Deposit to confirm (50%): €${deposit}`);
  L.push(``);
  L.push(`To secure your date, please send the ${o.paid>0?'remaining':'50% deposit'} and the proof of payment:`);

  L.push(`IBAN: ${BIZ.iban}`);
  L.push(``);

  setTimeout(()=>{b.textContent="📋 Copy summary for WhatsApp";b.classList.remove('ok');},1800);
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(()=>fallbackCopy(txt));}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}

async function saveQuote(id){const o=ORDERS.find(x=>x.id===id);const v=Number(document.getElementById('quotePrice').value);if(!Number.isFinite(v)||v<=0){alert('Enter the final quote before saving.');return;}o.price=v;o.range=false;const {error}=await sb.from('orders').update({price:v,price_range:false}).eq('id',id);if(error){alert('Could not save the quote: '+error.message);return;}refreshView();openSheet(id);}
async function setOrderStatus(id,st){const o=ORDERS.find(x=>x.id===id);if(!o)return;if(st==='quoted'&&!(o.price>0)){alert('Enter and save the final quote before moving this order to Quoted.');return;}if(st==='confirmed'&&o.paid<=0){alert('Record the received payment before moving this order forward.');return;}const patch={status:st};if(st==='cancelled'&&!o.cancelledBy)patch.cancelled_by='owner';const {error}=await sb.from('orders').update(patch).eq('id',id);if(error){alert('Could not update status: '+error.message);return;}o.status=st;if(patch.cancelled_by)o.cancelledBy=patch.cancelled_by;activeBucket=bucketOf(o);refreshView();openSheet(id);}
async function deleteOrder(id){const o=ORDERS.find(x=>x.id===id);if(!o)return;const next=o.status==='deleted'?'new':'deleted';const {error}=await sb.from('orders').update({status:next}).eq('id',id);if(error){alert('Could not move this order: '+error.message);return;}o.status=next;activeBucket=bucketOf(o);closeSheet();refreshView();}

function courierReminder(o,lang){if(!o.courier)return '';return lang==='pt'?`\n\nComo selecionou a opção de estafeta, recordamos que o Uber/Bolt deve ser reservado e acompanhado por si. A encomenda estará disponível para levantamento na data e hora combinadas.`:`\n\nAs you selected the courier option, please remember that the Uber/Bolt courier must be booked and tracked by you. Your order will be ready for collection at the agreed date and time.`;}
function isRushOrder(o){return /RUSH ORDER SURCHARGE:/i.test(String(o&&o.notes||''));}
function quoteValidityHours(o){return isRushOrder(o)?6:48;}
function quoteMessage(o){const pt=orderLanguage(o)==='pt',hours=quoteValidityHours(o),url=o.portalUrl||'[link will appear after generation]';return pt?`Olá ${o.name},\n\nO seu orçamento está pronto.\n\nConsulte o seu orçamento e os dados de pagamento através do link abaixo.\n${url}\n\nEste orçamento é válido durante ${hours} horas. Para reservar a sua data, o sinal de 50% deverá ser pago dentro deste prazo. Após ${hours} horas, a sua data poderá deixar de estar disponível.\n\nSe tiver alguma questão, basta responder a esta mensagem.${courierReminder(o,'pt')}`:`Hello ${o.name},\n\nYour quote is ready.\n\nView your quote and payment details using the link below.\n${url}\n\nThis quote is valid for ${hours} hours. To reserve your date, the 50% deposit must be paid within this time. After ${hours} hours, your date may no longer be available.\n\nIf you have any questions, simply reply to this message.${courierReminder(o,'en')}`;}
function confirmedMessage(o){const pt=orderLanguage(o)==='pt';const address=BIZ.address||'Rua Francisco Lyon de Castro nº 14\nEntrecampos, Lisbon 1600-311';return pt?`A sua encomenda está confirmada ✔️\n\n📅 Data de levantamento: ${fmtDate(o.pdate)}\n🕒 Hora: ${o.ptime}\n📍 Local de levantamento:\n${address}\n\nQuando chegar, envie-me uma mensagem. Abrirei a porta e encontrá-la-ei no átrio com a sua encomenda.\n\nPor favor, chegue à hora marcada. Atrasos podem afetar o levantamento.\n\nObrigada!${courierReminder(o,'pt')}`:`Your order is confirmed ✔️\n\n📅 Pick-up date: ${fmtDate(o.pdate)}\n🕒 Time: ${o.ptime}\n📍 Pick-up location:\n${address}\n\nUpon arrival, send me a message. I’ll buzz you in and meet you in the lobby with your order.\n\nPlease arrive at your scheduled time. Late arrivals may affect your collection.\n\nThank you!${courierReminder(o,'en')}`;}
function feedbackMessage(o){const pt=orderLanguage(o)==='pt';return pt?`Olá ${o.name}! ✨ Espero que tenha gostado do seu bolo. Adoraria saber a sua opinião sobre o bolo, se o sabor e o design corresponderam às suas expectativas e como foi o processo de encomenda.\n\nSe tirou fotografias da celebração ou do corte do bolo, adoraria que partilhasse uma comigo para poder apresentá-la no meu Instagram.\n\nSe preferir mantê-las privadas, não há qualquer problema. Basta responder: “Prefiro não partilhar”.\n\nMuito obrigada pela sua encomenda.`:`Hi ${o.name}! ✨ I hope you enjoyed your cake. I’d love to hear what you thought about the cake, whether the taste and design met your expectations, and how the ordering process was.\n\nIf you took any photos of your celebration or cake-cutting, I’d love it if you could share one with me for a feature on my Instagram.\n\nIf you’d rather keep them private, that’s absolutely okay. Simply reply, “I’d rather not share”.\n\nThank you again for your order.`;}

function openContactPanel(){const o=ORDERS.find(x=>x.id===openId);if(!o)return;const deposit=o.price/2,remaining=Math.max(0,o.price-o.paid);const portal=isActivePortal(o)?`<div class="portal-box"><b>Customer quote page</b><div class="portal-url">${escHtml(o.portalUrl)}</div><div>Expires ${escHtml(new Date(o.portalExpires).toLocaleString())}</div><p><button onclick="copyText('${escAttr(o.portalUrl)}')">Copy link</button> <button class="muted-btn" onclick="generatePortal(${o.id})">Create new 48h link</button></p></div>`:`<div class="portal-box"><b>No active customer link</b><p class="infonote">A link can be created after the final price is saved and the order is Quoted.</p><button onclick="generatePortal(${o.id})">Create 48h quote link</button></div>`;

async function markMessage(id,key,complete){const map={quote:'message_quote_sent_at',confirmed:'message_confirmed_sent_at',feedback:'message_feedback_sent_at'};const field=map[key];const value=complete?new Date().toISOString():null;const {error}=await sb.from('orders').update({[field]:value}).eq('id',id);if(error){alert('Could not save this step: '+error.message);return;}const o=ORDERS.find(x=>x.id===id);o[key+'SentAt']=value;openContactPanel();}
function applyPortalResult(o,result){const portalBase=result.url||`https://byamandasoyer.pt/order/${result.token}`;o.portalToken=result.token;o.portalExpires=result.expires_at;o.portalTerminatedAt='';o.portalUrl=portalBase+(portalBase.includes('?')?'&':'?')+'lang='+orderLanguage(o);o.dashboardPortalUrl=dashboardCopyUrlForToken(result.token);o.customerDecision='';o.quoteSentAt='';quoteVersionCache.delete(o.id);}

async function generatePortal(id){

const LIST_TITLES={new_orders:'New Orders',waiting_customer:'Deposit Due',deposit_paid:'Deposit Received',cake_delivered:'Ready for Collection',done:'Done',cancelled:'Cancelled',deleted:'Archived'};
function renderList(){

    const fresh=sortOverviewOrders(items.filter(o=>!o.read)),opened=sortOverviewOrders(items.filter(o=>o.read));
    if(fresh.length){html+=`<div class="ghead"><span>Incoming Orders - New</span><span class="ln"></span><span>${fresh.length}</span></div>`;fresh.forEach(o=>html+=cardHTML(o));}

function overviewPickupInfo(o){if(!o.pdate)return {primary:'Date not set',time:'',meta:'Pick-up date required',tone:'overdue'};const d=new Date(o.pdate+'T00:00:00');if(Number.isNaN(d.getTime()))return {primary:'Date not set',time:'',meta:'Pick-up date required',tone:'overdue'};d.setHours(0,0,0,0);const n=Math.round((d-today)/86400000),dateLabel=`${d.getDate()} ${MO[d.getMonth()]}`;if(n===0)return {primary:'Today',time:o.ptime||'',meta:dateLabel,tone:'today'};if(n===1)return {primary:'Tomorrow',time:o.ptime||'',meta:dateLabel,tone:'tomorrow'};if(n<0)return {primary:dateLabel,time:o.ptime||'',meta:n===-1?'1 day overdue':`${-n} days overdue`,tone:'overdue'};return {primary:dateLabel,time:o.ptime||'',meta:`in ${n} days`,tone:n<=3?'tomorrow':'scheduled'};}

function orderBadgeData(o){
  if(o.status==='cancelled')return [{label:'Cancelled',kind:'closed'}];
  if(o.status==='deleted')return [{label:'Archived',kind:'closed'}];
  if(o.status==='done')return [
    {label:'Pick-up Completed',kind:'ready'},
    {label:o.feedbackSentAt?'Feedback Sent':'Request Feedback',kind:o.feedbackSentAt?'accepted':'sent'}
  ];
  const stage=workflowStage(o),ready=isReadyForCollection(o),bucket=bucketOf(o),delta=pickupDeltaMs(o),badges=[];
  if(stage===1)badges.push({label:'Set Price',kind:'action'});
  else if(stage===2)badges.push({label:'Send Confirmation',kind:'sent'});
  else if(stage===3){badges.push({label:'Deposit Due',kind:'due'});if(o.customerDecision==='accepted')badges.push({label:'Quote Accepted',kind:'accepted'});}
  else if(bucket==='deposit_paid'){
    if(o.price>0&&o.paid>=o.price)badges.push({label:'Paid in Full',kind:'paid'});
    else badges.push({label:'Deposit Received',kind:'received'});
    if(!o.confirmedSentAt)badges.push({label:'Send Address',kind:'sent'});
    else{
      const days=pickupDaysLeft(o);
      if(days!==null)badges.push({label:days>1?`${days} days Left`:days===1?'1 day Left':days===0?'Today':'Overdue',kind:days<=1?'overdue':'closed'});
    }
  }
  else if(ready){
    const fullyPaid=o.price>0&&o.paid>=o.price,lastHour=delta!==null&&delta>0&&delta<=3600000;
    if(fullyPaid)badges.push({label:'Paid in Full',kind:'paid'});
    else if(o.paid>0)badges.push({label:'Deposit Received',kind:'received'});
    else badges.push({label:'Deposit Due',kind:'due'});
    badges.push({label:'Ready for Collection',kind:'ready'});
    if(!fullyPaid&&delta!==null&&delta<=0)badges.push({label:'Due Full Payment',kind:'overdue'});
    else if(lastHour)badges.push({label:'Last 1 Hour',kind:'urgent'});
  }
  return badges.length?badges:[{label:'Review Order',kind:'closed'}];
}

function editRushAmount(sizeId,pdate){

function calculatedEditPrice(o,d,pdate){
  const size=ORDER_EDIT.sizes.find(x=>x.v===d.sizeId)||ORDER_EDIT.sizes[1];
  if(size.base===null)return {price:o.price,range:o.range};
  let sum=size.base,range=false;
  if(d.shape==='Heart'||d.shape==='Square')sum+=size.big?8:5;
  if(d.shape==='Rectangle')sum+=size.big?10:8;
  if(ORDER_EDIT.signature.includes(d.flavor))sum+=size.v==='XL'?10:(size.v==='L'?8:6);
  sum+=(d.pigments||[]).length*5;
  if(d.cupcakes==='6 Cupcakes')sum+=15;if(d.cupcakes==='12 Cupcakes')sum+=30;
  if((d.writingMethods||[]).includes('Fondant Letters'))sum+=size.big?6:5;
  if((d.writingMethods||[]).includes('Cutout Letters'))sum+=size.big?10:8;
  (d.decor||[]).forEach(x=>{if(x==='Bows')sum+=size.big?5:3;else if(x==='Edible prints')sum+=size.big?15:10;else if(x==='Paper butterflies')sum+=size.big?8:5;else if(x==='Maraschino cherries')sum+=size.big?8:6;else if(x==='Maraschino cherries + glitter')sum+=size.big?10:8;else if(ORDER_EDIT.quoteDecor.includes(x))range=true;});
  sum+=editRushAmount(d.sizeId,pdate);
  return {price:sum,range};
}

function openMessagePanel(key){const o=ORDERS.find(x=>x.id===openId);if(!o)return;const activePortal=isActivePortal(o),portal=portalManagerHTML(o);window.__messages={quote:quoteMessage(o),confirmed:confirmedMessage(o),feedback:feedbackMessage(o)};const title={quote:'Send Quote via WhatsApp',confirmed:'Send Information via WhatsApp',feedback:'Feedback Request via WhatsApp'}[key]||'WhatsApp Message';const card={quote:msgCard(o,'quote','1. Quote Ready',window.__messages.quote,activePortal?o.quoteSentAt:null),confirmed:msgCard(o,'confirmed','2. Order Confirmed',window.__messages.confirmed,o.confirmedSentAt),feedback:msgCard(o,'feedback','3. Post-order Feedback',window.__messages.feedback,o.feedbackSentAt)}[key]||'';document.getElementById('contactTitle').textContent=title;document.getElementById('contactBody').innerHTML=(key==='quote'?portal:'')+card;document.getElementById('panelOverlay').classList.add('show');document.getElementById('contactPanel').classList.add('show');if(key==='quote'&&o.portalToken)loadQuoteVersions(o.id);}
function openContactPanel(){const o=ORDERS.find(x=>x.id===openId);if(!o)return;openMessagePanel(messageStepFor(o)||'quote');}
async function markMessage(id,key,complete){const o=ORDERS.find(x=>x.id===id);if(!o)return;if(complete&&key==='quote'&&!isActivePortal(o)){alert(`Create an active ${quoteValidityHours(o)}-hour customer link first.`);return;}if(complete&&key==='confirmed'&&o.paid<=0){alert('Record the received payment before completing this step.');return;}const field={quote:'message_quote_sent_at',confirmed:'message_confirmed_sent_at',feedback:'message_feedback_sent_at'}[key],value=complete?new Date().toISOString():null,patch={[field]:value};let next=o.status;if(complete&&key==='quote')next='awaiting_payment';if(complete&&key==='feedback')next='done';if(next!==o.status)patch.status=next;const {error}=await sb.from('orders').update(patch).eq('id',id);if(error){alert('Could not save this step: '+error.message);return;}o[key+'SentAt']=value;o.status=next;activeBucket=bucketOf(o);if(complete)closeContactPanel();refreshView();openSheet(id);if(!complete)openMessagePanel(key);}
function completeMessageAndOpen(event,id,key,url){event.preventDefault();const o=ORDERS.find(x=>x.id===id);if(!o)return false;if(key==='quote'&&!isActivePortal(o)){alert(`Create an active ${quoteValidityHours(o)}-hour customer link first.`);return false;}if(key==='confirmed'&&o.paid<=0){alert('Record the received payment before completing this step.');return false;}closeContactPanel();window.open(url,'_blank');markMessage(id,key,true);return false;}

/* Keep a short, visible press state even when an action immediately redraws or opens another app. */
document.addEventListener('pointerdown',event=>{
  const target=event.target.closest('.message-actions button,.message-actions a,.portal-box button,.message-launch,.do-next-action');
  if(!target)return;
  target.classList.add('is-pressed');
  window.setTimeout(()=>target.classList.remove('is-pressed'),180);
},{passive:true});

/* ---------- auth ---------- */
/* Update data quietly without reloading the page or disturbing its position. */
let pollTimer=null;
function startAutoRefresh(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(()=>{if(!document.hidden)refreshOrders();},60000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOrders();});

/* a light, client-only "once a day" message — no server/SQL involved. A localStorage flag keyed by
   today's date caps it to a single showing per calendar day; an hourly recheck (only while the tab is
   open and visible) means it can still appear even on a session that spans past midnight. */
let loveTimer=null;
function closeLovePopup(){document.getElementById('lovePopup').classList.remove('show');}
function maybeShowLovePopup(){
  if(document.hidden)return;
  try{
    const today=new Date().toDateString();
    if(localStorage.getItem('caner_love_popup_date')===today)return;
    localStorage.setItem('caner_love_popup_date',today);
  }catch(e){return;}
  document.getElementById('lovePopup').classList.add('show');
}
function startLovePopupWatcher(){
  setTimeout(maybeShowLovePopup,4000);
  if(loveTimer)clearInterval(loveTimer);
  loveTimer=setInterval(maybeShowLovePopup,60*60*1000);
}

async function tryLogin(){
  const pw=document.getElementById('pw').value;
  document.getElementById('pwErr').style.display='none';
  if(!sb){document.getElementById('pwErr').textContent='Connection not ready — refresh the page.';document.getElementById('pwErr').style.display='block';return;}
  try{
    const {error}=await sb.auth.signInWithPassword({email:LOGIN_EMAIL,password:pw});
    if(error)throw error;
    await loadAll();
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    setView('orders');
    startAutoRefresh();startLovePopupWatcher();
  }catch(e){
    document.getElementById('pwErr').textContent='Wrong password — try again.';
    document.getElementById('pwErr').style.display='block';
  }
}

function hardRestartDashboard(){const url=new URL(window.location.href);url.searchParams.set('_restart',Date.now());window.stop();window.location.replace(url.toString());}
function logout(){if(sb)sb.auth.signOut();document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';document.getElementById('pw').value='';document.getElementById('pwErr').style.display='none';}
/* Prevent focus zoom, pinch zoom and accidental browser zoom throughout the dashboard. */
['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,event=>event.preventDefault(),{passive:false}));
document.addEventListener('touchmove',event=>{if(event.touches.length>1)event.preventDefault();},{passive:false});
document.addEventListener('dblclick',event=>event.preventDefault(),{passive:false});
document.addEventListener('wheel',event=>{if(event.ctrlKey)event.preventDefault();},{passive:false});
document.addEventListener('keydown',event=>{const key=String(event.key||'').toLowerCase();if((event.ctrlKey||event.metaKey)&&['+','-','=','0'].includes(key))event.preventDefault();},true);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
