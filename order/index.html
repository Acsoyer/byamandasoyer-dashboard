      const add=(name,amount,kind='',description='')=>{rows.push({name,amount,kind,description});if(typeof amount==='number')known+=amount;},basePrices={'XS Bento':30,'S':40,'M':55,'L':80,'XL':110},shapePrices={Heart:big?8:5,Square:big?8:5,Rectangle:big?10:8},signature=new Set(['Berry Cheesecake','Pistachio Strawberry','Salted Caramel Peanut','Biscoff','Coconut Passion']),writingPrices={'Fondant Letters':big?6:5,'Cutout Letters':big?10:8},decorPrices={Bows:big?5:3,'Edible prints':big?15:10,'Paper butterflies':big?8:5,'Maraschino cherries':big?8:6,'Maraschino cherries + glitter':big?10:8},quotedDecor=new Set(['Custom themed images','Decorative balls','Disco balls','Fresh edible flowers','Fresh fruits','Gold or silver star, sun, moon','Custom']),base=basePrices[size],rawShape=String(x.shape||'').replace(/\s+Shape$/i,'');
